<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#46c942" />
    <title>Calc</title>
    <link rel="manifest" href="/calc/manifest.webmanifest" />
    <link rel="icon" href="/calc/icon-192.png" />
    <!-- Inline so the splash paints before the bundle has loaded. -->
    <style>
      #splash {
        color-scheme: light dark;
        position: fixed; inset: 0; z-index: 1000; display: grid; place-content: center; justify-items: center; gap: 14px;
        background: light-dark(oklch(98.5% 0.003 250), oklch(25% 0.008 260));
        color: light-dark(oklch(25% 0.01 260), oklch(92% 0.005 260));
        font: 13px/1.4 system-ui, sans-serif;
        transition: opacity 240ms ease, visibility 0s 240ms;
      }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 10px 30px oklch(0% 0 0 / 0.18); }
      #splash h1 { margin: 6px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      #splash p { margin: 0; color: light-dark(oklch(52% 0.01 260), oklch(70% 0.008 260)); }
      #splash .bar { position: relative; width: 180px; height: 3px; overflow: hidden; border-radius: 2px; background: light-dark(oklch(90% 0.004 260), oklch(38% 0.008 260)); }
      #splash .bar::after {
        content: ''; position: absolute; inset-block: 0; left: 0; width: 40%; border-radius: inherit; background: oklch(55% 0.15 150);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      /* A transform runs on the compositor: it keeps moving while a large document is laid out. */
      @keyframes splash-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; left: 0; opacity: 0.5; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img src="/calc/icon-192.png" alt="" />
      <h1>Calc</h1>
      <p id="splash-status">Starting…</p>
      <div class="bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
